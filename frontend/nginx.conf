server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location = /health { proxy_pass http://backend:8080/actuator/health; }
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://backend:8080/api/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location ~* \.(js|css|svg|png|jpg|woff2)$ { expires 7d; add_header Cache-Control "public, immutable"; }
}
